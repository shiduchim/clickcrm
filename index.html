<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1D5BB6">
  <title>ClickCRM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231D5BB6'/%3E%3Cpath d='M9 22V10h3v12zm5-6l9-6v12z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1.0.0">
  <script src="config.js?v=1.0.0"></script>
  <script src="app.js?v=1.0.0" defer></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>ClickCRM</div>
      <nav class="side-nav" aria-label="Main">
        <a href="#/today" data-nav="today">Today <span class="nav-count" data-count="unread"></span></a>
        <a href="#/companies" data-nav="companies">Companies</a>
        <a href="#/products" data-nav="products">Products</a>
        <a href="#/import" data-nav="import">Import list</a>
        <a href="#/settings" data-nav="settings">Settings</a>
      </nav>
      <div class="side-foot">
        <div class="side-user" id="side-user"></div>
        <button class="link-btn" data-act="sign-out">Sign out</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="search-wrap">
          <input id="global-search" type="search" autocomplete="off" dir="auto"
                 placeholder="Find a company, email or phone" aria-label="Find a company, email or phone">
          <div id="search-results" class="search-results" hidden></div>
        </div>
        <span id="sync-pill" class="sync-pill" role="status"></span>
        <button class="btn" data-act="check-replies">Check replies</button>
      </header>
      <div id="banner" class="banner" hidden></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <nav class="tabbar" aria-label="Main">
      <a href="#/today" data-nav="today">Today<span class="nav-count" data-count="unread"></span></a>
      <a href="#/companies" data-nav="companies">Companies</a>
      <a href="#/products" data-nav="products">Products</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
  </div>

  <div id="signin" class="signin" hidden>
    <div class="signin-card">
      <div class="brand big"><span class="brand-mark" aria-hidden="true"></span>ClickCRM</div>
      <p class="signin-text">Sign in with your CRM account to continue.</p>
      <div id="signin-button"></div>
      <p id="signin-msg" class="signin-msg" role="alert"></p>
    </div>
  </div>

  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
